spring.application.name=filehandler

# Server port - Render sets PORT env var automatically
server.port=${PORT:8080}

# PostgreSQL Connection Settings
# REQUIRED for Render/production - set these as environment variables:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/dbname
#   SPRING_DATASOURCE_USERNAME=user
#   SPRING_DATASOURCE_PASSWORD=pass
#
# NOTE: a plain provider URL (postgres:// or postgresql://) is also accepted and is
# normalized automatically by DatabaseUrlEnvironmentPostProcessor.
#
# For local development, defaults are provided below
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/honeycomb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:praful}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# RabbitMQ (SPRING_RABBITMQ_* env vars override these, e.g. host=rabbitmq in Docker)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# Publisher confirms so a chunk message that never reached the broker is visible in the logs.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# Without a broker the RabbitMQ health indicator reports DOWN and drags the whole
# /actuator/health (and the Docker/Render health check) down with it. Default off;
# set MANAGEMENT_HEALTH_RABBIT_ENABLED=true for the original queue mode.
management.health.rabbit.enabled=${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}

# Upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:100MB}

# JWT Secret - MUST be set via JWT_SECRET env var in production
# Generate with: openssl rand -base64 48
# This default is ONLY for local development (32 bytes = 256 bits)
jwt.secret=${JWT_SECRET:neyXoYLfAFYG5bCTpVgfyMhFRzDaY8rorQrcAsT43Tfcwva02FiUNi74GHNbMHhF}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Where uploaded audio is stored. In Docker this is a shared volume mounted in the worker too.
# Override with the APP_STORAGE_DIR env var.
app.storage.dir=${APP_STORAGE_DIR:/home/praful/Stuff/bee/temp-storage}
# Delete audio, chunks and rows for jobs older than this many days (0 disables cleanup).
app.storage.retention-days=${APP_STORAGE_RETENTION_DAYS:7}
app.cleanup.cron=${APP_CLEANUP_CRON:0 0 3 * * *}

# Fail jobs that stay in PROCESSING longer than this (a lost worker cannot hang a job forever).
app.job.timeout-minutes=${APP_JOB_TIMEOUT_MINUTES:30}
app.job.watchdog-interval-ms=${APP_JOB_WATCHDOG_INTERVAL_MS:60000}

# Silence-based chunking. Audio is normalized to 16 kHz mono WAV before splitting.
app.ffmpeg.path=${FFMPEG_PATH:ffmpeg}
app.ffprobe.path=${FFPROBE_PATH:ffprobe}
app.chunk.target-seconds=${APP_CHUNK_TARGET_SECONDS:600}
app.chunk.silence-noise-db=${APP_CHUNK_SILENCE_NOISE_DB:-35}
app.chunk.silence-min-duration=${APP_CHUNK_SILENCE_MIN_DURATION:0.5}
app.chunk.overlap-seconds=${APP_CHUNK_OVERLAP_SECONDS:1.0}

# Rate limiting and a cap on jobs running at the same time per user.
app.rate-limit.uploads-per-minute=${APP_RATE_LIMIT_UPLOADS_PER_MINUTE:10}
app.rate-limit.max-active-jobs=${APP_RATE_LIMIT_MAX_ACTIVE_JOBS:3}

# Actuator health endpoints are used by the Docker healthchecks.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Swagger UI at /swagger-ui.html, raw spec at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
# Transcription mode
#   queue      : original async flow (RabbitMQ + Python worker)
#   whispercpp : synchronous, embedded whisper.cpp binary (no worker needed)
#   api        : synchronous, hosted OpenAI-compatible API (e.g. Groq free tier)
# In whispercpp mode, setting fallback-to-api=true retries via the API when the
# local engine fails (useful when a 512 MB instance OOMs).
# ---------------------------------------------------------------------------
app.transcription.mode=${TRANSCRIPTION_MODE:queue}
app.transcription.fallback-to-api=${TRANSCRIPTION_FALLBACK_TO_API:false}

# Embedded whisper.cpp (only used when mode=whispercpp)
app.whisper.binary=${APP_WHISPER_BINARY:/opt/whisper/whisper-cli}
app.whisper.model=${APP_WHISPER_MODEL:/opt/models/ggml-tiny-q5_1.bin}
app.whisper.threads=${APP_WHISPER_THREADS:1}

# Hosted OpenAI-compatible transcription API (mode=api, or the fallback)
# Groq free tier works out of the box: set GROQ_API_KEY.
app.transcription.api.url=${TRANSCRIPTION_API_URL:https://api.groq.com/openai/v1/audio/transcriptions}
app.transcription.api.key=${TRANSCRIPTION_API_KEY:${GROQ_API_KEY:}}
app.transcription.api.model=${TRANSCRIPTION_API_MODEL:whisper-large-v3-turbo}
